backend:
  name: github
  repo: mangawhai-directory/mangawhai-directory.github.io
  branch: main
  # PAT auth — sign in via "Use a Personal Access Token" on the login screen.
  # No OAuth proxy / Cloudflare Worker required for a single-owner setup.

# Where new media uploads land in the repo, and how URLs are rewritten in
# front-matter. Hugo serves /static/* at the site root, so an image saved to
# static/uploads/foo.jpg is referenced as /uploads/foo.jpg in content.
media_folder: "static/uploads"
public_folder: "/uploads"

# Show CMS-edited entries in the public site only after the editor explicitly
# publishes; until then they live in PRs. Sveltia inherits Decap's editorial
# workflow semantics — drafts stay in a feature branch via the GitHub backend.
publish_mode: editorial_workflow

site_url: https://mangawhai-directory.github.io
display_url: https://mangawhai-directory.github.io

collections:
  # ──────────────────────────────────────────────────────────────────────
  # Businesses — the primary collection. One markdown file per listing.
  # Field order here is the order they appear in the editor.
  # ──────────────────────────────────────────────────────────────────────
  - name: businesses
    label: Businesses
    label_singular: Business
    folder: content/businesses
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{title}}{{#if status}} — {{status}}{{/if}}"
    sortable_fields: [title, last_verified, status]
    view_filters:
      - { label: Active, field: status, pattern: active }
      - { label: Closed, field: status, pattern: closed }
    view_groups:
      - { label: Category, field: categories }
      - { label: Status, field: status }
      - { label: Tier, field: tier }
      - { label: Suburb, field: address.suburb }
    fields:
      - name: tier
        label: Listing tier
        widget: select
        default: free
        options:
          - { label: Free, value: free }
          - { label: Paid, value: paid }
      - { name: title, label: Business name, widget: string }
      - { name: slug, label: URL slug, widget: string, hint: "Lowercase, hyphens only. Used as the filename. Don't change after creation — breaks deep links." }
      - { name: blurb, label: Blurb, widget: text, required: false, pattern: ['^(\s*\S+\s*){0,50}$', 'Keep it under 50 words'], hint: "Short description shown under the name on the category page. Aim for 1–2 sentences (max 50 words)." }
      - { name: image, label: Image / logo (premium), widget: image, required: false, hint: "Square image shown to the left of your listing. Premium add-on — see the Advertise page. Square crop works best (e.g. 400×400)." }

      - name: address
        label: Address
        widget: object
        collapsed: false
        fields:
          - { name: street, label: Street, widget: string }
          - { name: suburb, label: Suburb, widget: string, hint: "e.g. Mangawhai, Mangawhai Heads, Te Arai" }
          - { name: postcode, label: Postcode, widget: string, pattern: ['^\d{4}$', 'Must be 4 digits'] }
          - { name: country, label: Country code, widget: string, default: "NZ" }

      - { name: phone, label: Phone, widget: string, required: false, pattern: ['^(\+64\d{8,11})?$', 'Use E.164 format with no spaces or brackets, e.g. +6494314505 — drop the leading 0 and prefix +64'], hint: "E.164 format, e.g. +6494314505. Not the local 09 … form — the schema check in CI rejects it." }
      - { name: email, label: Email, widget: string, required: false, pattern: ['^([^\s@]+@[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+)?$', 'Enter a full email address, e.g. hello@example.co.nz (or leave blank)'], hint: "Full address including the domain. Leave blank if the business prefers phone contact." }
      - { name: website, label: Website, widget: string, required: false, pattern: ['^(https?://[^\s/?#]+\.[^\s/?#]+(/[^\s]*)?)?$', 'Must be a full URL starting with https:// — e.g. https://example.co.nz, not example.co.nz'], hint: "Full URL including https://. Prefer https:// — CI warns on plain http://." }

      - name: socials
        label: Social profiles
        widget: object
        collapsed: true
        fields:
          - { name: facebook, label: Facebook URL, widget: string, required: false }
          - { name: instagram, label: Instagram URL, widget: string, required: false }
          - { name: x, label: X (Twitter) URL, widget: string, required: false }
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - { name: tiktok, label: TikTok URL, widget: string, required: false }
          - { name: youtube, label: YouTube URL, widget: string, required: false }

      # Pulled dynamically from the categories collection so newly-created
      # categories show up in the dropdown without needing to edit this file.
      - name: categories
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        multiple: true
        min: 1
        max: 3

      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Free-form labels. Common ones: family-friendly, dog-friendly, waterfront, takeaway, licensed, mangawhai-heads"

      - name: hours
        label: Opening hours
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.dayOfWeek}}: {{fields.opens}}–{{fields.closes}}"
        fields:
          - { name: dayOfWeek, label: Day(s), widget: list, hint: "One or more day names, e.g. Monday, Tuesday. Multiple days share an opens/closes pair." }
          - { name: opens, label: Opens, widget: string, hint: 'HH:MM (24h), or "closed"' }
          - { name: closes, label: Closes, widget: string, required: false, hint: "HH:MM (24h). Leave blank if 'closed' is set in opens." }

      - { name: nzbn, label: NZBN, widget: string, required: false, hint: "13-digit NZ Business Number. Optional." }
      - name: last_verified
        label: Last verified
        widget: datetime
        type: date
        format: "YYYY-MM-DD"
        default: ""
      - name: status
        label: Status
        widget: select
        default: active
        options:
          - { label: Active, value: active }
          - { label: Closed / Discontinued, value: closed }

  # ──────────────────────────────────────────────────────────────────────
  # Categories — folder collection over content/categories/<slug>/_index.md.
  # `path` ensures new entries land at <slug>/_index.md (Hugo branch bundle).
  # ──────────────────────────────────────────────────────────────────────
  - name: categories
    label: Categories
    label_singular: Category
    folder: content/categories
    path: "{{slug}}/_index"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Display name, widget: string, hint: "e.g. Cafés & Restaurants" }
      - { name: hidden, label: Hide from site, widget: boolean, default: false, required: false, hint: "When on, this category is removed from the homepage, the LLMs index, related-category links and the category list page. Its own page URL still resolves." }

      # Powers the "Related categories" chips at the bottom of the category page.
      # Self-references, unknown slugs and hidden categories are filtered out at
      # render time, so a stale entry degrades quietly rather than breaking the page.
      - name: related
        label: Related categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        multiple: true
        required: false
        max: 5
        hint: "Categories a visitor to this page would plausibly want next. Add the reverse link on the other category too — the site does not do it automatically. 3–5 works best; more than 5 dilutes them."

      - { name: keywords, label: SEO keywords, widget: list, required: false }
      - { name: aliases, label: Old URLs (redirects), widget: list, required: false, hint: "Paths this category used to live at, e.g. /categories/bakeries/. Hugo redirects them here. Leave existing entries alone — removing one breaks old links." }
      - { name: description, label: Meta description override, widget: text, required: false, hint: "Optional. Leave blank to use the description generated from the category name and business count." }
      - { name: body, label: Intro copy, widget: markdown, required: false, hint: "Optional intro paragraph shown under the category heading. The page's meta description is generated automatically from the category name and business count." }

  # ──────────────────────────────────────────────────────────────────────
  # Pages — the home page plus fixed top-level content files
  # (advertise, contact, privacy, terms).
  # ──────────────────────────────────────────────────────────────────────
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: content/_index.md
        fields:
          - { name: title, label: Heading (H1), widget: string, hint: "Big heading in the homepage hero banner. Leave blank to fall back to the site title." }
          - { name: description, label: Tagline, widget: text, hint: "Sentence under the heading in the hero banner. Also used as the homepage meta description for Google, so keep it under ~155 characters." }
      - name: advertise
        label: Advertise
        file: content/advertise.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text }
          - { name: body, label: Body, widget: markdown }
      - name: contact
        label: Contact
        file: content/contact.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text }
          - { name: body, label: Body, widget: markdown }
      - name: privacy
        label: Privacy Policy
        file: content/privacy.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text }
          - { name: body, label: Body, widget: markdown }
      - name: terms
        label: Terms & Conditions
        file: content/terms.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text }
          - { name: body, label: Body, widget: markdown }
