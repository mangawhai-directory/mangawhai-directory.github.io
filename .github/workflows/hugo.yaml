name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Ad bookings (data/ads.yaml) are chosen by the month the build runs in (NZ
  # time, see TZ below), so the site is rebuilt to put a new month's ads up
  # and take the old ones down. The rebuild runs every day at 12:00 UTC,
  # which is 00:00 NZST / 01:00 NZDT the following NZ day: the run at 12:00
  # UTC on the last day of a month is the first hour of the 1st in NZ, so the
  # switch lands on the 1st. (A monthly cron on the 1st at 12:00 UTC would be
  # the 2nd in NZ.) The other days rebuild an unchanged site, about a minute
  # each on a public repository, where Actions minutes are free. GitHub runs
  # cron on the default branch only, may start it a few minutes late, and
  # switches it off after 60 days without a commit (CMS saves keep this
  # repository active).
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      HUGO_ENVIRONMENT: production
      # The month that picks ad bookings is read from the clock in this zone.
      TZ: Pacific/Auckland
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
