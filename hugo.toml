baseURL = "https://mangawhaidirectory.co.nz/"
title = "Mangawhai Directory"
locale = "en-nz"
defaultContentLanguage = "en"
enableRobotsTXT = true
pluralizelisttitles = false

[params]
  description = "Free local business directory for Mangawhai, Mangawhai Heads, Te Arai and Kaiwaka — find cafés, trades, shops, services and things to do in the area."
  defaultKeywords = ["mangawhai", "mangawhai heads", "northland", "directory", "local business"]
  contactEmail = ""

# Hugo executes the Tailwind CLI from node_modules/.bin to build assets/css/main.css.
# Setting security.exec.allow replaces Hugo's default list, so the defaults are repeated
# here alongside tailwindcss (dropped from the defaults in Hugo 0.165).
[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["html", "rss", "llms"]
  taxonomy = ["html"]
  term = ["html"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Advertise"
  url = "/advertise/"
  weight = 2

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 3

[[menu.footer]]
  name = "Privacy"
  url = "/privacy/"
  weight = 1

[[menu.footer]]
  name = "Terms"
  url = "/terms/"
  weight = 2
