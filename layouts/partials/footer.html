<footer data-print-hide class="mt-16 border-t border-border bg-muted/40">
  <div class="mx-auto flex max-w-6xl flex-col-reverse items-center gap-4 px-4 py-8 sm:flex-row sm:justify-between">
    <div class="flex flex-col items-center gap-1 sm:items-start">
      <p class="text-sm text-muted-foreground m-0">© {{ now.Year }} {{ site.Title }}</p>
      <p class="flex items-center gap-1 text-sm text-muted-foreground m-0">
        Made with
        <svg class="h-4 w-4 text-red-500" viewBox="0 0 24 24" role="img" aria-label="love" focusable="false"><path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.02C.9 10.4 1.4 7.1 3.76 5.5a5.2 5.2 0 0 1 6.9.94L12 7.9l1.34-1.46a5.2 5.2 0 0 1 6.9-.94c2.36 1.6 2.86 4.9 1.09 7.48C18.7 16.65 12 21 12 21z"/></svg>
        by
        <a class="font-medium text-muted-foreground underline underline-offset-4 transition-colors hover:text-foreground" href="https://sandersonhowe.nz" rel="noopener noreferrer" target="_blank">Sanderson Howe</a>
      </p>
    </div>
    <nav aria-label="Footer">
      <ul class="flex flex-wrap items-center gap-1 list-none m-0 p-0">
        {{ range site.Menus.footer }}
        <li>
          <a class="inline-flex h-9 items-center rounded-md px-3 text-sm font-medium text-muted-foreground no-underline transition-colors hover:bg-accent hover:text-accent-foreground" href="{{ .URL | relURL }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</footer>
